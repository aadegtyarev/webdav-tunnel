name: Release

# Builds everything this fork ships — Linux/Windows binaries and the Android APK —
# and attaches them to the GitHub Release for the pushed tag. The binary is one
# program (client / server / selfhosted via -mode); the APK embeds the same Go code
# as a gomobile AAR.
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # manual run (attaches to the release for the latest tag, if any)

permissions:
  contents: write           # create/update releases

env:
  GO_VERSION: '1.25.5'
  # Pin gomobile to the x/mobile version in go.mod to avoid toolchain skew.
  GOMOBILE_VERSION: 'v0.0.0-20260602190626-68735029466e'
  NDK_VERSION: '26.3.11579264'

jobs:
  binaries:
    name: Linux & Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            out=dist/webdav-tunnel-$os-$arch
            [ "$os" = windows ] && out=$out.exe
            echo "→ $out"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "$out" .
          done
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: gomobile bind → AAR
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target android -androidapi 24 \
            -o android/app/libs/webdavtunnel.aar ./mobile
      - name: Decode release keystore
        # `secrets` is not allowed in a step `if:`, so guard inside the script instead.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi
      - name: Build release APK
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          if [ "$HAS_KEYSTORE" = "true" ]; then
            src=app/build/outputs/apk/release/app-release.apk
          else
            src=app/build/outputs/apk/release/app-release-unsigned.apk
            echo "::warning::No KEYSTORE_BASE64 secret — shipping an UNSIGNED release APK."
          fi
          cp "$src" "$GITHUB_WORKSPACE/webdav-tunnel-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: webdav-tunnel-android.apk

  release:
    name: Attach to release
    needs: [binaries, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
